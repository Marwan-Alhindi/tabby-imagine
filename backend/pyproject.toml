[project]
name = "tabby-imagine-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.4",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langsmith>=0.14.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sse-starlette>=3.5.0",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.32",
]
